<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="robots" content="noindex">
  <title>College Assistant Admin</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.min.js"></script>
</head>

<body class="bg-slate-50 text-slate-800 min-h-screen">

  <header class="bg-slate-800 text-white p-4 flex justify-between items-center sticky top-0 z-10">
    <h1 class="text-lg font-bold">🔧 Admin Panel</h1>
    <button id="logout" class="hidden text-sm bg-slate-600 rounded px-3 py-1">Log out</button>
  </header>

  <main id="app" class="max-w-3xl mx-auto p-4"></main>

  <script>
    // ====== PASTE THE SAME SUPABASE DETAILS AS index.html ======
    const SUPABASE_URL = "https://hfrtayjeodtlmfllvkuu.supabase.co";
    const SUPABASE_KEY = "sb_publishable_xInsvmdM6kVMcQOa234ciA_rzhl8wTU";
    // ===========================================================

    const db = supabase.createClient(SUPABASE_URL, SUPABASE_KEY);
    const app = document.getElementById("app");
    const esc = s => String(s ?? "").replace(/[&<>"']/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
    const inp = "w-full border rounded-lg p-2 mb-3 bg-white";
    const btn = "rounded-lg px-4 py-2 text-white ";

    const T = {
      notices: { label: "Notices", order: "date", fields: [["title", "text"], ["description", "area"], ["date", "date"], ["department", "text"], ["pdf_link", "text"]], title: r => r.title, sub: r => `${r.date} · ${r.department}` },
      exams: { label: "Exams", order: "date", fields: [["course", "text"], ["semester", "number"], ["subject", "text"], ["date", "date"], ["time", "text"], ["room", "text"]], title: r => r.subject, sub: r => `${r.course} Sem ${r.semester} · ${r.date}` },
      rooms: { label: "Rooms", order: "class", fields: [["class", "text"], ["day", "text"], ["time", "text"], ["room_number", "text"]], title: r => r.class, sub: r => `${r.day} · ${r.time} · ${r.room_number}` },
      departments: { label: "Departments", order: "name", fields: [["name", "text"], ["location", "text"], ["contact", "text"], ["timings", "text"], ["services", "area"]], title: r => r.name, sub: r => r.location },
      faqs: { label: "FAQs", order: "question", fields: [["question", "text"], ["answer", "area"]], title: r => r.question, sub: r => (r.answer || "").slice(0, 80) },
    };
    let current = "notices", editingId = null, rows = [];

    function showLogin(msg = "") {
      document.getElementById("logout").classList.add("hidden");
      app.innerHTML = `<div class="bg-white rounded-xl border p-5 mt-6">
    <h2 class="font-bold text-lg mb-3">Admin login</h2>
    <input id="email" type="email" class="${inp}" placeholder="Email" autocomplete="username">
    <input id="pass" type="password" class="${inp}" placeholder="Password" autocomplete="current-password">
    <button id="go" class="${btn} bg-blue-700 w-full">Log in</button>
    <p id="msg" class="text-red-600 text-sm mt-3">${esc(msg)}</p></div>`;
      const go = async () => {
        const { error } = await db.auth.signInWithPassword({ email: val("email").trim(), password: val("pass") });
        if (error) return (document.getElementById("msg").textContent = error.message);
        start();
      };
      document.getElementById("go").onclick = go;
      document.getElementById("pass").addEventListener("keydown", e => { if (e.key === "Enter") go(); });
    }
    const val = id => document.getElementById(id).value;

    async function start() {
      const { data } = await db.auth.getSession();
      if (!data.session) return showLogin();
      document.getElementById("logout").classList.remove("hidden");
      draw();
    }

    async function draw(note = "") {
      const t = T[current];
      const { data, error } = await db.from(current).select("*").order(t.order, { ascending: current === "notices" || current === "exams" ? false : true });
      rows = data || [];
      const edit = rows.find(r => r.id === editingId) || {};
      app.innerHTML = `
    <div class="flex gap-2 overflow-x-auto mb-4">${Object.keys(T).map(k =>
        `<button data-t="${k}" class="${btn} ${k === current ? "bg-blue-700" : "bg-slate-400"} whitespace-nowrap text-sm">${T[k].label}</button>`).join("")}</div>
    ${note ? `<p class="mb-3 text-sm ${note.startsWith("Error") ? "text-red-600" : "text-green-700"}">${esc(note)}</p>` : ""}
    ${error ? `<p class="text-red-600 text-sm mb-3">${esc(error.message)}</p>` : ""}
    <div class="bg-white rounded-xl border p-4 mb-5">
      <h2 class="font-bold mb-3">${editingId ? "Edit item" : "Add new " + t.label.toLowerCase()}</h2>
      ${t.fields.map(([f, type]) => `<label class="text-xs text-slate-500">${f.replace("_", " ")}</label>` + (type === "area"
          ? `<textarea id="f_${f}" rows="3" class="${inp}">${esc(edit[f])}</textarea>`
          : `<input id="f_${f}" type="${type}" class="${inp}" value="${esc(edit[f])}">`)).join("")}
      <button id="save" class="${btn} bg-green-700">${editingId ? "Save changes" : "Add"}</button>
      ${editingId ? `<button id="cancel" class="${btn} bg-slate-500 ml-2">Cancel</button>` : ""}
    </div>
    <h2 class="font-bold mb-2">${rows.length} ${t.label.toLowerCase()}</h2>
    ${rows.map(r => `<div class="bg-white rounded-xl border p-3 mb-2 flex justify-between gap-3">
      <div><b>${esc(t.title(r))}</b><p class="text-xs text-slate-500">${esc(t.sub(r))}</p></div>
      <div class="whitespace-nowrap"><button data-e="${r.id}" class="text-blue-700 text-sm mr-3">Edit</button>
      <button data-d="${r.id}" class="text-red-600 text-sm">Delete</button></div></div>`).join("")}`;

      app.querySelectorAll("[data-t]").forEach(b => b.onclick = () => { current = b.dataset.t; editingId = null; draw(); });
      app.querySelectorAll("[data-e]").forEach(b => b.onclick = () => { editingId = Number(b.dataset.e); draw(); window.scrollTo(0, 0); });
      app.querySelectorAll("[data-d]").forEach(b => b.onclick = async () => {
        if (!confirm("Delete this item permanently?")) return;
        const { error } = await db.from(current).delete().eq("id", Number(b.dataset.d));
        editingId = null; draw(error ? "Error: " + error.message : "Deleted.");
      });
      document.getElementById("save").onclick = save;
      const c = document.getElementById("cancel"); if (c) c.onclick = () => { editingId = null; draw(); };
    }

    async function save() {
      const t = T[current], payload = {};
      for (const [f, type] of t.fields) {
        let v = val("f_" + f).trim();
        payload[f] = v === "" ? null : (type === "number" ? Number(v) : v);
      }
      if (!payload[t.fields[0][0]]) return draw("Error: " + t.fields[0][0] + " is required.");
      const q = editingId ? db.from(current).update(payload).eq("id", editingId) : db.from(current).insert(payload);
      const { error } = await q;
      const wasEdit = !!editingId; editingId = null;
      draw(error ? "Error: " + error.message : (wasEdit ? "Saved." : "Added."));
    }

    document.getElementById("logout").onclick = async () => { await db.auth.signOut(); showLogin(); };
    start();
  </script>
</body>

</html>
